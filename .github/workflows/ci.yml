name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npm run typecheck
      - run: npm run build
      - name: Playwright smoke test
        run: node scripts/smoke-playwright.mjs
      - name: Live source smoke test
        run: node scripts/smoke-sources.mjs
      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate npm lockfile [skip ci]"
          git push
